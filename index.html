<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deokgi Kim — AI Researcher & LLM Engineer</title><style>html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:#FBFBF9;color:#6A6A6E}body{display:grid;place-items:center}main{padding:32px}</style></head><body><main>Loading portfolio…</main><script>(async()=>{const paths=["compact_v2/p0.txt", "compact_v2/p1.txt", "compact_v2/p2.txt", "compact_v2/p3.txt", "compact_v2/p4.txt"];const parts=await Promise.all(paths.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error('payload fetch failed: '+p);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();})().catch(err=>{document.body.innerHTML='<main><h1>Portfolio load error</h1><p>'+String(err.message||err)+'</p></main>';});</script></body></html>
