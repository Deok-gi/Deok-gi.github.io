<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deokgi Kim — AI Researcher & LLM Engineer</title>
<style>html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:#FBFBF9;color:#6A6A6E}body{display:grid;place-items:center}main{padding:32px}</style>
</head>
<body><main>Loading portfolio…</main><script>
(async()=>{
  const paths=['portfolio_payload/gz_00.txt','portfolio_payload/gz_01_0.txt','portfolio_payload/gz_01_1.txt','portfolio_payload/gz_01_2.txt','portfolio_payload/gz_02_0.txt','portfolio_payload/gz_02_1.txt','portfolio_payload/gz_02_2.txt'];
  const [legacy,...parts]=await Promise.all([
    fetch('legacy.html').then(r=>{if(!r.ok)throw new Error('legacy fetch failed');return r.text()}),
    ...paths.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error('payload fetch failed: '+p);return r.text()}))
  ]);
  const imgs=[...legacy.matchAll(/data:image\/[^;]+;base64,[A-Za-z0-9+/=]+/g)].map(m=>m[0]);
  if(imgs.length<2) throw new Error('legacy images not found');
  const b64=parts.join('').replace(/\s+/g,'');
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  html=html.replace('data:image/jpeg;base64,__IMAGE_69060__',imgs[0]);
  html=html.replace('data:image/jpeg;base64,__IMAGE_236736__',imgs[1]);
  if(html.includes('__IMAGE_')) throw new Error('image placeholders unresolved');
  document.open();document.write(html);document.close();
})().catch(err=>{
  document.body.innerHTML='<main><h1>Portfolio load error</h1><p>'+String(err.message||err)+'</p><p><a href="legacy.html">Open previous version</a></p></main>';
});
</script></body></html>
